[project]
name = "angi"
version = "0.1.0"
description = "Hom nay an gi? - sassy AI lunch decider for Vietnamese office workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/angi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
